name: Source Drift

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Linter de contratos contra fuentes en vivo
        run: bun run drift
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
